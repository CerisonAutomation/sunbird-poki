<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4aa0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sunbird — a one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <title>Sunbird — Golden Flight</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sunbird — Golden Flight" />
    <meta property="og:description" content="A one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:url" content="https://cerison.itch.io/sunbird" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sunbird — Golden Flight" />
    <meta name="twitter:description" content="A one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Self-hosted fonts (116 KB total): no CDN dependency, portal-safe,
         offline-safe. @font-face rules live in src/index.css and are inlined
         as data: URIs by vite-plugin-singlefile in portal builds. Preload
         links are emitted by Vite's CSS handling automatically; explicit
         <link rel="preload"> tags with absolute /fonts/ URLs would bypass
         processing and generate external-resource warnings on portals. -->
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-shell">
      <!-- Inline boot loader. Shown until React takes over the container, so a
           cold start on a slow connection is never a blank white page. Inline
           CSS only: no external requests, nothing to wait for. The shell stays outside React until the game has painted its first frame. -->
      <style>
        .boot {
          position: fixed;
          z-index: 10000;
          inset: 0;
          display: grid;
          place-items: center;
          background: linear-gradient(180deg, #4aa0e8 0%, #a8e4ff 60%, #7ec8e8 100%);
          color: #16324a;
          font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        .boot-inner { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px; }
        .boot-mark { position: relative; width: 212px; height: 190px; }
        .boot-sun { position: absolute; left: 64px; top: 53px; filter: drop-shadow(0 5px 14px rgba(255, 190, 60, .45)); animation: boot-sun-pulse 2.4s ease-in-out infinite; }
        /* Bird orbits the sun via pure translate — no rotation on the bird itself,
           so it always stays horizontally upright regardless of orbit position,
           matching the flock-loading animation in the PvP room. */
        .boot-orbit { position: absolute; left: 77px; top: 25px; animation: boot-bird-orbit 3s linear infinite; }
        .boot-bird { display: block; filter: drop-shadow(0 4px 8px rgba(83, 52, 31, .35)); }
        .boot-wing { animation: boot-flap .28s ease-in-out infinite alternate; }
        @keyframes boot-flap { from { transform: rotate(-16deg); } to { transform: rotate(28deg); } }
        .boot-title { font-size: 20px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
        .boot-copy { max-width: 280px; color: #356078; font-size: 13px; line-height: 1.45; }
        .boot-retry { display: none; border: 0; border-radius: 999px; padding: 11px 18px; background: #ff8a3a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .boot.is-error .boot-bar { display: none; }
        .boot.is-error .boot-copy, .boot.is-error .boot-retry { display: block; }
        .boot-bar { width: 132px; height: 6px; border-radius: 999px; background: rgba(22, 50, 74, 0.18); overflow: hidden; }
        .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #ff8a3a; animation: boot-slide 1.1s ease-in-out infinite; }
        /* Once BootProgress reports a real stage, the bar becomes a measurement:
           the slide animation stops and the width is the weighted work done
           (EA-04 — a progress bar the player can trust). */
        .boot-bar.is-determinate i { width: 0%; animation: none; transition: width 0.35s ease-out; }
        @keyframes boot-sun-pulse { 0%,100% { filter: drop-shadow(0 5px 14px rgba(255,190,60,.45)); } 50% { filter: drop-shadow(0 5px 28px rgba(255,190,60,.75)); } }
        @keyframes boot-bird-orbit {
          0%    { transform: translate(0px,     0px); }
          12.5% { transform: translate(31.1px,  12.9px); }
          25%   { transform: translate(44px,    44px); }
          37.5% { transform: translate(31.1px,  75.1px); }
          50%   { transform: translate(0px,     88px); }
          62.5% { transform: translate(-31.1px, 75.1px); }
          75%   { transform: translate(-44px,   44px); }
          87.5% { transform: translate(-31.1px, 12.9px); }
          100%  { transform: translate(0px,     0px); }
        }
        @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
        @media (prefers-reduced-motion: reduce) {
          .boot-orbit, .boot-bird, .boot-wing, .boot-bar i, .boot-sun { animation: none; }
        }
      </style>
      <div class="boot" id="boot">
        <div class="boot-inner">
          <div class="boot-mark" aria-hidden="true"><!-- BOOT_SUN --><span class="boot-orbit"><!-- BOOT_BIRD --></span></div>
          <div class="boot-title">Sunbird</div>
          <div class="boot-copy" id="boot-copy" role="status">Warming up the wings…</div>
          <div class="boot-bar" id="boot-bar" role="progressbar" aria-label="Loading Sunbird" aria-valuemin="0" aria-valuemax="100"><i id="boot-bar-fill"></i></div>
          <button class="boot-retry" id="boot-retry" type="button">Reload Sunbird</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
