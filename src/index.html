<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sunbird: A sunny multiplayer flying game" />
    <meta name="theme-color" content="#FDB833" />
    
    <!-- Preload critical assets -->
    <link rel="preload" as="style" href="/assets/index.css" />
    
    <!-- Load fonts with proper as="font" and type attributes (no preload for unused fonts) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fredoka-latin-600-normal.woff2"
      crossorigin
    />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/index.css" type="text/css" />
    
    <title>Sunbird 🌤️</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-status" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #1976d2;">
        <div style="text-align: center;">
          <!-- BOOT_SUN -->
          <!-- BOOT_BIRD -->
          <p style="margin-top: 2em; font-size: 1.2em;">Loading Sunbird...</p>
          <p style="font-size: 0.9em; color: #666; margin-top: 0.5em;">🔄 Initializing game engine</p>
        </div>
      </div>
    </div>
    
    <!-- Boot sequence (handles asset loading, multiplayer init, game boot) -->
    <script type="module" src="/src/boot/index.ts"></script>
  </body>
</html>
